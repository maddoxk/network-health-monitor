name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -v

  compose-smoke:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file and Prometheus config
        run: |
          docker compose config -q
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro" \
            prom/prometheus:v2.54.1 check config /p/prometheus.yml
      - name: Start stack
        run: docker compose up -d --build
      - name: Smoke test (health, /metrics, Prometheus targets, Grafana)
        run: python3 scripts/smoke_test.py
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
